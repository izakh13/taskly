<h1>My tasks</h1>
<a href='{% url 'task_create' %}'>New task</a>
<ul>
    {% for task in tasks %}
        <li>{{ task.title }} ({{ task.created_at }}) ({{ task.description }}) 
            <form method="post" action="{% url 'improve' task.id %}">
                {% csrf_token %}
                <button type="submit">Improve description</button></li>
            </form>
    {% endfor %}
</ul>
