{% extends 'base.html' %}
{% block content %}
<ul class="list-group list-group-flush">
    {% for task in tasks %}
        <li class="list-group-item d-flex justify-content-between align-items-start">
            <div class="ms-2 me-auto">
                <div class="fw-fold">{{ task.title }}</div>
                <span style="font-size: 13px;">{{ task.created_at }} {{ task.description }}</span>
            </div>
            <div class="gap-1 btn-group align-items-center">
                <form method="post" action="{% url 'improve' task.id %}">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-warning btn-sm" data-bs-toggle="tooltip" data-bs-placement="bottom" data-bs-title="Improve task description">Improve</button>
                </form>
                <form method="post" action="{% url 'delete' task.id %}">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger btn-sm" data-bs-toggle="tooltip" data-bs-placement="bottom" data-bs-title="Delete task">Delete</button>
                </form>
            </div>
        </li>
    {% endfor %}
</ul>
{% endblock %}
