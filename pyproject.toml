[tool.ruff]
line-length = 88
target-version = "py314"
extend-exclude = ["migrations"]


[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]

[tool.ruff.lint.per-file-ignores]
"**/settings.py" = ["E501"]